version: '3.8'

services:
  # 1. PostgreSQL Database with pre-configured pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: skilltrace_db
    restart: always
    environment:
      POSTGRES_DB: skilltrace
      POSTGRES_USER: vigneshb
      POSTGRES_PASSWORD: CB9uRRDvglD986DGdJWK7RpUAXFmrGj0
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigneshb -d skilltrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: skilltrace_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Python FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skilltrace_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://vigneshb:CB9uRRDvglD986DGdJWK7RpUAXFmrGj0@db:5432/skilltrace
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Asynchronous Longitudinal Worker
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skilltrace_celery_worker
    restart: always
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://vigneshb:CB9uRRDvglD986DGdJWK7RpUAXFmrGj0@db:5432/skilltrace
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. React + TypeScript + Tailwind CSS Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skilltrace_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
