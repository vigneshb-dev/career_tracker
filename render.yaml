services:
  - type: web
    name: skilltrace-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://skilltracer-app.onrender.com,https://skilltracer.onrender.com,https://skilltrace.onrender.com,http://localhost:3000,http://localhost:5173
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: RENDER_MEMORY_LIMIT_MIB
        value: "512.0"
      - key: MEMORY_WARNING_THRESHOLD_MIB
        value: "400.0"
